<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .refused-edge { stroke: #cf222e; stroke-width: 2; fill: none; }
    .refused-label { fill: #cf222e; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #8b949e; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .refused-edge { stroke: #ff7b72; }
      .refused-label { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect x="20" y="50" width="130" height="50" rx="6" class="box"/>
  <text x="85" y="80" text-anchor="middle" class="name">agent</text>
  <rect x="295" y="50" width="130" height="50" rx="6" class="box"/>
  <text x="360" y="80" text-anchor="middle" class="name">spec folder</text>
  <rect x="570" y="50" width="130" height="50" rx="6" class="box"/>
  <text x="635" y="80" text-anchor="middle" class="name">wfctl</text>

  <line x1="150" y1="75" x2="293" y2="75" class="edge" marker-end="url(#arrow)"/>
  <text x="222" y="66" text-anchor="middle" class="label">writes scan</text>

  <line x1="425" y1="75" x2="568" y2="75" class="edge later" marker-end="url(#arrow)"/>
  <text x="497" y="66" text-anchor="middle" class="label">reads Verdict</text>

  <path d="M85,100 V160 H635 V104" class="refused-edge"/>
  <text x="360" y="152" text-anchor="middle" class="refused-label">"the scan ran"</text>
  <text x="635" y="128" text-anchor="middle" class="refused-label" font-size="18">✗</text>

  <text x="20" y="215" class="caption">wfctl reads the scan file and doesn't take the agent's word that the scan ran.</text>
</svg>
