# workmux project configuration — wfctl
#
# Adapted from pfms's config. wfctl is a single Python package installed with
# uv: no server/client split, no .env files, no ports to assign.
# For global settings, edit ~/.config/workmux/config.yaml
# Full reference: https://github.com/jhulten/workmux (or the pfms copy).

#-------------------------------------------------------------------------------
# Git
#-------------------------------------------------------------------------------

main_branch: main
base_branch: main

#-------------------------------------------------------------------------------
# Naming & Paths
#-------------------------------------------------------------------------------

worktree_dir: wt
worktree_naming: full

#-------------------------------------------------------------------------------
# Tmux
#-------------------------------------------------------------------------------

mode: session
window_prefix: 'wfctl__'

windows:
  - name: term
    panes:
      - command: ''
  - name: agent
    panes:
      - command: <agent>
        focus: true

#-------------------------------------------------------------------------------
# Agent
#-------------------------------------------------------------------------------

# Deliberately unset. wfctl is agent-agnostic, so which assistant launches in the
# `agent` window is a per-developer preference, not a property of this repo.
# workmux resolves `<agent>` from ~/.config/workmux/config.yaml, falling back to
# its own default.
# agent: claude

#-------------------------------------------------------------------------------
# Hooks
#-------------------------------------------------------------------------------

# Branch names carry the tracker's issue key, since wfctl derives both the spec
# dir and the state dir from it. Nothing in this file enforces that. workmux has
# no hook that runs before creation and ignores an unknown key without a
# warning, so the `pre_create` gate this file used to carry never ran (#497).
# `wfctl start` enforces it instead, in every linked worktree however it was
# made, and refuses a session on a branch that names no open issue.

post_create:
  # wf-skills files are gitignored, so a fresh worktree has none of them.
  #
  # No `--agent` hardcoded: this repo is the agent-agnostic install tool, and a
  # committed config that always writes .claude/ is the exact assumption #5
  # exists to remove. Set WFCTL_AGENT in your shell profile to also install your
  # assistant's layer; unset installs the agent-agnostic layer only.
  #
  # `uv run`, not a bare `wfctl`: a bare one is the released wheel, so a worktree
  # opened to change `wfctl/agents/` would come up holding the *last release's*
  # skills rather than the source it is about to edit. This repo develops the
  # installer, so it has to install from itself.
  #
  # ponytail: plain re-install, ~1s warm. pfms symlinks from the root checkout
  # instead (scripts/link-wf-skills.sh) to skip the clone — do not copy that
  # here: a worktree needs its own source's skills, not the main checkout's, and
  # linking is what spread one orphaned file across twelve worktrees in #38.
  # No `--prune`: the manifest is per-worktree and gitignored, so a fresh
  # worktree has no prior record to diff against and the flag is inert here. It
  # earns its place at session start, where a record exists.
  - cd "$WM_WORKTREE_PATH" && uv run wfctl install-skills ${WFCTL_AGENT:+--agent "$WFCTL_AGENT"} || true

  # Nothing else sets the board's `In Progress` column, so a board that carries
  # priority and epic correctly still cannot say what is being worked on. This
  # is the moment work actually starts. A handle with no issue key is not
  # refused here, and `wfctl issue start` reports it and moves nothing; the
  # session that follows is what refuses it. No issue number on this line:
  # `wfctl issue start` reads it off the branch using the tracker's own key
  # shape, which a hook re-deriving it here would have to hardcode. Runs after
  # install-skills because the verb it calls is defined by
  # `.agents/trackers/github.json`, which that step is what puts in the
  # worktree.
  #
  # `|| true` is the load-bearing part. Every worktree in this repo is created
  # through here, including for work that answers to no issue and on a machine
  # with no network, and the verb no-ops anyway on a tracker with no board. A
  # board one column stale is a smaller failure than a worktree that will not
  # come up.
  - cd "$WM_WORKTREE_PATH" && uv run wfctl issue start || true

pre_remove:
  # Work git can't see is lost with the worktree: untracked files, and the
  # gitignored `specs/` folder, so a worktree holding only design artifacts reads
  # *clean* and workmux removes it without complaint. This hook stops a removal
  # that would lose work and saves what it can, and it prints the commands to run
  # by hand when it stops.
  #
  # `wfctl archive-specs` is the name this repository's hook still uses, and it is
  # the same command as `wfctl hook worktree-remove`. It refuses when the worktree
  # has uncommitted edits, commits on no remote that aren't merged into trunk, or
  # spec files that differ from the main checkout's copies. Otherwise it copies the
  # spec files into the main checkout and the untracked files into wfctl's
  # per-branch state dir under `unsaved/`. A spec dir outside the worktree, as in
  # this repository, is committed and pushed in its spec store instead, and a
  # failed push warns without stopping the removal.
  #
  # No `|| true`. A failing pre_remove hook aborts the removal, and that is the
  # point: the hook exits 1 only to stop a removal that would lose work, and exits 0
  # on any other failure, so a bug in it can't strand a worktree.
  #
  # A block scalar, not a folded one. YAML folds a plain multi-line scalar's
  # break into a space, which would turn `else` into an argument rather than a
  # keyword — it passes `bash -n`, then invokes wfctl with four junk arguments
  # (non-zero: every removal refused) and never prints the warning.
  #
  # The missing-wfctl branch proceeds deliberately: blocking there would strand
  # every worktree on a machine that never had the tool.
  - |
    if command -v wfctl >/dev/null; then
      wfctl archive-specs "$WM_WORKTREE_PATH" "$WM_HANDLE"
    else
      echo "⚠ wfctl not on PATH — specs in $WM_WORKTREE_PATH not archived"
    fi

  # The other half of the transition above: a branch torn down without merging
  # would otherwise leave its issue reading `In Progress` for good. Runs *after*
  # the archive hook, because that one can refuse the removal — moving the column
  # first would report the work stopped on a worktree that is still there.
  #
  # `stop` writes only over the column `start` left, and only while the issue is
  # open — so the ordinary case (work merged, `Closes #N` fired, worktree
  # removed) leaves `Done` alone, and a change already in review keeps the column
  # its review earned it.
  - cd "$WM_WORKTREE_PATH" && uv run wfctl issue stop || true

#-------------------------------------------------------------------------------
# Files
#-------------------------------------------------------------------------------

# Nothing to copy or symlink into a worktree: wfctl has no .env, and uv resolves
# dependencies per-run rather than from a checked-in node_modules equivalent.
files: {}
