# workmux project configuration — wfctl
#
# Adapted from pfms's config. wfctl is a single Python package installed with
# uv: no server/client split, no .env files, no ports to assign.
# For global settings, edit ~/.config/workmux/config.yaml
# Full reference: https://github.com/jhulten/workmux (or the pfms copy).

#-------------------------------------------------------------------------------
# Git
#-------------------------------------------------------------------------------

main_branch: main
base_branch: main

#-------------------------------------------------------------------------------
# Naming & Paths
#-------------------------------------------------------------------------------

worktree_dir: wt
worktree_naming: full

#-------------------------------------------------------------------------------
# Tmux
#-------------------------------------------------------------------------------

mode: session
window_prefix: 'wfctl__'

windows:
  - name: term
    panes:
      - command: ''
  - name: agent
    panes:
      - command: <agent>
        focus: true

#-------------------------------------------------------------------------------
# Agent
#-------------------------------------------------------------------------------

# Deliberately unset. wfctl is agent-agnostic, so which assistant launches in the
# `agent` window is a per-developer preference, not a property of this repo.
# workmux resolves `<agent>` from ~/.config/workmux/config.yaml, falling back to
# its own default.
# agent: claude

#-------------------------------------------------------------------------------
# Hooks
#-------------------------------------------------------------------------------

# Branch names carry the tracker's issue key — wfctl derives both the spec dir
# and the state dir from it, so a handle without one leaves both unresolvable.
pre_create:
  - |
    if ! echo "$WM_HANDLE" | grep -qE '^[0-9]+'; then
      echo "Error: '$WM_HANDLE' must start with an issue number (e.g. 005-my-feature)."
      exit 1
    fi

post_create:
  # wf-skills files are gitignored, so a fresh worktree has none of them.
  #
  # No `--agent` hardcoded: this repo is the agent-agnostic install tool, and a
  # committed config that always writes .claude/ is the exact assumption #5
  # exists to remove. Set WFCTL_AGENT in your shell profile to also install your
  # assistant's layer; unset installs the agent-agnostic layer only.
  #
  # ponytail: plain re-install, ~15s of network. pfms symlinks from the root
  # checkout instead (scripts/link-wf-skills.sh) to skip the clone — worth
  # copying here only if worktree creation starts feeling slow.
  - cd "$WM_WORKTREE_PATH" && wfctl install-skills ${WFCTL_AGENT:+--agent "$WFCTL_AGENT"} || true

pre_remove:
  # Gitignored artifacts are invisible to every git-based check: a worktree
  # holding only `specs/` reads *clean*, so workmux removes it without complaint
  # and the design work is gone. Work git can see — tracked edits, untracked
  # files — already stops removal on its own ("Worktree has uncommitted
  # changes"). This hook covers exactly the set nothing else can.
  #
  # `wfctl archive-specs` copies them into wfctl's per-branch state dir,
  # flattened and numbered in pipeline order with a generated index. It is a
  # forensic snapshot, not a tree you can copy back.
  #
  # No `|| true`. A failing pre_remove hook aborts the removal, and that is now
  # the point: if artifacts were at risk and could not be preserved, losing the
  # worktree is the worse outcome. archive-specs exits non-zero only in that
  # case — a durable spec root, nothing to archive, or an unrelated internal
  # failure all still exit 0, so an unrelated bug cannot strand a worktree.
  #
  # A block scalar, not a folded one. YAML folds a plain multi-line scalar's
  # break into a space, which would turn `else` into an argument rather than a
  # keyword — it passes `bash -n`, then invokes wfctl with four junk arguments
  # (non-zero: every removal refused) and never prints the warning.
  #
  # The missing-wfctl branch proceeds deliberately: blocking there would strand
  # every worktree on a machine that never had the tool.
  - |
    if command -v wfctl >/dev/null; then
      wfctl archive-specs "$WM_WORKTREE_PATH" "$WM_HANDLE"
    else
      echo "⚠ wfctl not on PATH — specs in $WM_WORKTREE_PATH not archived"
    fi

#-------------------------------------------------------------------------------
# Files
#-------------------------------------------------------------------------------

# Nothing to copy or symlink into a worktree: wfctl has no .env, and uv resolves
# dependencies per-run rather than from a checked-in node_modules equivalent.
files: {}
