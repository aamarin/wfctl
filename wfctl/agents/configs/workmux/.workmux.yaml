# workmux project configuration — wfctl standard starter.
# Repo-agnostic conventions; fill in project-specific hooks where noted.
# Global settings live in ~/.config/workmux/config.yaml.

#-------------------------------------------------------------------------------
# Naming & Paths
#-------------------------------------------------------------------------------
worktree_dir: wt          # worktrees land in ./wt/<handle> (gitignored by installer)
worktree_naming: full

# Per-project tmux session/window name prefix (workmux default: "wm-").
# window_prefix: "<project>__"

#-------------------------------------------------------------------------------
# Tmux
#-------------------------------------------------------------------------------
mode: session

windows:
  - name: agent
    panes:
      - command: <agent>
        focus: true
  - name: term
    panes:
      - command: ''

#-------------------------------------------------------------------------------
# Agent
#-------------------------------------------------------------------------------
agent: claude

#-------------------------------------------------------------------------------
# Hooks
#-------------------------------------------------------------------------------
# Every worktree works against an open issue, and nothing in this file enforces
# it. workmux has no hook that runs before a worktree is created, and a worktree
# made with `git worktree add` runs no hook at all. `wfctl start` enforces it
# instead: in a linked worktree it refuses to open a session when the branch
# names no issue under the tracker's `key_pattern`, when the issue is closed or
# missing, or when the worktree has no wfctl install. So a handle such as
# `359-my-feature` is what makes the worktree usable, and a refused one says
# which command fixes it.
#
# Not in `post_create` either. A failing `post_create` aborts `workmux add` but
# leaves the worktree and its branch on disk with no session, which is the state
# the check exists to prevent.

# wf-skills files are gitignored, so a fresh worktree has none of them: no
# skills, no commands, no `.specify/` runtime. Reinstalling here is what makes a
# new worktree usable at all.
#
# No `--agent` hardcoded. This file is committed, and the agent is per-developer
# with no correct value to infer — the same reason `install-config` leaves
# `agent:` commented rather than guessing. Set WFCTL_AGENT in your shell profile
# to also install your assistant's layer; unset installs the agent-agnostic
# `.agents/` layer only, which every agent reads.
#
# `|| true` because a missing wfctl must not stop the worktree from coming up.
post_create:
  - cd "$WM_WORKTREE_PATH" && wfctl install-skills ${WFCTL_AGENT:+--agent "$WFCTL_AGENT"} || true

  # Tell the tracker work on this issue has begun. A backend with a board moves
  # the item to its in-progress column; one without simply does not declare the
  # verb, and the call no-ops with a notice. No issue number here: the key comes
  # off the branch under the tracker's own `key_pattern`, so nothing in this
  # line has to know what a key looks like, and a repo whose keys are `PROJ-123`
  # works here as one whose keys are numbers does.
  #
  # Second, not first: the verb is defined by `.agents/trackers/<name>.json`, and
  # the install above is what puts that in a fresh worktree.
  #
  # `|| true` for the same reason as the line above it, and it matters more here
  # — this one reaches the network, and no worktree should fail to come up
  # because a tracker was unreachable.
  - cd "$WM_WORKTREE_PATH" && wfctl issue start || true

# Further project-specific setup (ports, .env rewrites, db URLs) goes here, as
# additional entries above. Example — derive a port from the issue number:
#   - |
#     ISSUE=$(echo "$WM_HANDLE" | grep -oE '^[0-9]+')
#     sed -i '' "s|^PORT=.*|PORT=${ISSUE}|" "$WM_WORKTREE_PATH/.env"
#     exit 0

# Keep what the removal would delete, or stop it. `wfctl hook worktree-remove`
# refuses when the worktree has uncommitted edits, commits that are on no remote and
# not merged into trunk, or spec files that differ from the main checkout's copies,
# and it prints the commands to run by hand. When nothing stops it, it copies the
# spec files into the main checkout and the untracked files into wfctl's per-branch
# state dir under `unsaved/`.
#
# No `|| true`. The hook exits 1 to stop a removal, and `|| true` would turn every
# stop into a removal. It exits 0 on any other failure, so a bug in it can't strand a
# worktree. The `command -v` branch proceeds when wfctl is not on PATH, since
# blocking there would strand every worktree on a machine that never had the tool.
#
# This replaces workmux's default `pre_remove`, which auto-detects Node.js
# projects and fast-deletes node_modules. Add that back here if you need it.
pre_remove:
  - |
    if command -v wfctl >/dev/null; then
      wfctl hook worktree-remove "$WM_WORKTREE_PATH" "$WM_HANDLE"
    else
      echo "⚠ wfctl not on PATH — unsaved work in $WM_WORKTREE_PATH was not saved"
    fi

  # The counterpart to `issue start`: a branch abandoned rather than merged would
  # otherwise leave its issue reading in-progress forever. The verb writes only
  # over what `start` set, so a worktree removed after the work merged — or while
  # its change is in review — keeps the column it has moved on to.
  - cd "$WM_WORKTREE_PATH" && wfctl issue stop || true

#-------------------------------------------------------------------------------
# Files
#-------------------------------------------------------------------------------
# Files to copy into each new worktree (e.g. a gitignored .env):
# files:
#   copy:
#     - .env
