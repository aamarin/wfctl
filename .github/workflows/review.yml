name: Review

# Fails a PR while a review group has commits on it that no review covers.
# wfctl records each completed review, and each person's sign-off, as a git
# note under refs/notes/wfctl-review and sends it to origin. This job reads
# those notes. `.github/rulesets/main.json` requires it by its job name.
#
# `pull_request_target` makes GitHub run this file as it is on the base
# branch, with the base branch's wfctl, so a PR can't weaken its own check.
# That trigger also hands the job the base repository's token, which is why
# the job reads the PR's checkout only as data: it never installs, imports,
# or runs anything from `pr/`. The token can only read.
#
# `edited` is how a stacked PR is checked again when GitHub retargets it to
# main after its parent merges. It also fires on a title or description edit,
# which reruns the check to the same answer.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

# A retarget starts a run against the new base while the run against the old
# one may still be going. Cancelling the older run leaves the newer result.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # The base branch, and the only checkout whose code runs. No later step
      # needs the token, so it isn't saved.
      - uses: actions/checkout@v4
        with:
          path: trusted
          persist-credentials: false

      # The PR's head, read only as data: its commits, notes, and `wfctl.json`.
      # The check refuses a shallow clone, so this fetches the full history.
      # `actions/checkout` refuses a fork's head under this trigger unless the
      # step opts in. Opting in is safe because nothing in `pr/` runs, and the
      # `trusted` checkout never opts in because its code does. The token isn't
      # saved, so a fork's code can't read it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      # The repository is public, so the notes fetch needs no token.
      # With no notes on origin yet, every commit reads as unreviewed, which
      # is the right answer, so a missing ref doesn't stop the job.
      # `ls-remote --exit-code` exits 2 for a ref origin doesn't have, and any
      # other failure, such as a refused fetch, stops the job with git's own
      # message rather than reading as a branch nobody reviewed.
      - name: Fetch the review notes
        run: |
          found=0
          git -C pr ls-remote --exit-code origin refs/notes/wfctl-review > /dev/null || found=$?
          if [ "$found" = 0 ]; then
            git -C pr fetch origin +refs/notes/wfctl-review:refs/notes/wfctl-review
          elif [ "$found" != 2 ]; then
            exit "$found"
          fi

      # The cache is off. Under `pull_request_target` it's saved to the base
      # branch's scope, with a key hashed from every `uv.lock` in the workspace,
      # including `pr/`'s, so a fork could add an entry on every push.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      # uv runs only in `trusted/`, so it never reads a fork's `uv.toml`,
      # `pyproject.toml`, or `.python-version`. `--no-dev` skips the test and
      # lint tools.
      - name: Install wfctl
        working-directory: trusted
        run: uv sync --frozen --no-dev

      # The check calls the installed wfctl by its full path. From `pr/`,
      # `uv run wfctl` would run a zip file named `wfctl` from the working
      # directory in its place, and a fork can add one.
      # The base branch reaches the shell through `env`, so a branch name
      # holding shell text is only ever a quoted value.
      - name: Check every commit has been reviewed
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: '"$GITHUB_WORKSPACE/trusted/.venv/bin/wfctl" check reviews --base "$BASE_REF"'

      # The import check, twice: the rules, then whether a person approved what
      # this branch adds to the baseline, the map, or the files the check runs
      # with. It is the default branch's copy whatever the PR's base, so a
      # stacked PR gets the same merge base and digest as `wfctl arch
      # approve-imports`, and a branch can't loosen the copy that judges it.
      # The copy is written outside both checkouts and run with `-I`, so a PR's
      # own `ast.py` or `json.py` can't load in place of the standard library.
      # It reads `pr`'s files and git objects as data and runs none of them.
      - name: Check imports against the Context Map
        working-directory: pr
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          git rev-parse --verify "origin/$DEFAULT^{commit}"
          git show "origin/$DEFAULT:.github/scripts/check_imports.py" > "$RUNNER_TEMP/check_imports.py"
          python3 -I "$RUNNER_TEMP/check_imports.py"
          python3 -I "$RUNNER_TEMP/check_imports.py" --approvals --base "origin/$DEFAULT"
