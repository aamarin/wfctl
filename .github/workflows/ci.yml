name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: this repo stacks PRs (#15 targets #13's branch, not
  # main), and `branches: [main]` silently skips every one of them — the
  # PRs that most need a check are the ones that would not get it.
  pull_request:

# A new push to a PR makes the in-flight run pointless — drop it rather than
# queue behind it. main is excluded so every merge keeps a run of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11: test the floor and the current release,
        # since nothing here is version-sensitive enough to justify every minor.
        python: ["3.11", "3.13"]

    # Pin the interpreter for every uv command in the job rather than relying on
    # `uv python install` to steer later `uv sync`/`uv run` calls. It happened to
    # pick the right one (3.11.15 / 3.13.14 in the first run), but that is uv's
    # discovery order, not a guarantee — and a matrix that silently tests one
    # version twice is worse than no matrix, because it reports success.
    env:
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv sync --extra dev

      # Fails the job if the interpreter is not the one the matrix asked for,
      # so a silent fallback shows up as a red build instead of a green lie.
      - name: Assert the interpreter matches the matrix
        run: |
          actual=$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "matrix=${{ matrix.python }} actual=$actual"
          test "$actual" = "${{ matrix.python }}"

      # `conftest.py` `git init`s a real repo for every test that installs into
      # one, and wfctl resolves the branch and repo root by shelling out to git.
      # Runner defaults are not guaranteed to match what the tests assume, so pin
      # them rather than let a runner image change break the suite.
      - name: Configure git for the test suite
        run: |
          git config --global init.defaultBranch master
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Test
        run: uv run pytest -q

  # The one property the other two jobs structurally cannot check. Both run
  # against the source tree, where the vendored trees are present and executable
  # regardless of what the wheel ships — so a dropped `MANIFEST.in` graft or a
  # `.sh` committed 644 stays green here and fails on a user's machine.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build --wheel

      # Deliberately not `uv sync`, which installs the project editable and
      # would read `wfctl/agents/` straight off the checkout — passing even if
      # the wheel carried nothing at all.
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl

      - name: Assert the wheel carries the bundled trees, executable bit intact
        run: /tmp/wheel-env/bin/python .github/scripts/check_wheel_contents.py

      # Carrying the trees and installing them are separate failures: a target
      # pair repointed at a directory that no longer exists copies nothing and
      # still exits 0. Needs a real repo — wfctl resolves its root through git.
      - name: Install into a scratch repo from the wheel's own bundle
        run: |
          git config --global init.defaultBranch master
          git config --global user.email ci@example.com
          git config --global user.name CI
          git init /tmp/scratch-repo
          cd /tmp/scratch-repo && /tmp/wheel-env/bin/wfctl install-skills --yes

      - name: Assert the installed tree matches the shipped one
        run: /tmp/wheel-env/bin/python .github/scripts/check_installed_tree.py /tmp/scratch-repo

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      # `uv run`, not `uvx`: this has to be the version in uv.lock. `uvx ruff`
      # pulls whatever is newest, which means an upstream release can redden a
      # branch nobody touched — 0.16 would have added ~40 findings here.
      - name: Lint
        run: uv run ruff check .

      # Config lives in [tool.mypy], including which paths it covers, so this
      # stays a bare invocation rather than drifting from what runs locally.
      - name: Typecheck
        run: uv run mypy

  # The bump stays human — it belongs in the PR that makes the change, where the
  # major/minor/patch call has context. Only the tag is automated, because the
  # tag is the half that keeps getting dropped: `doctor` and `uv tool install`
  # both resolve releases by tag, so an untagged bump reports the stale build as
  # current (#55).
  tag:
    # Not a convenience ordering. A tag is what every machine upgrades to, so
    # tagging a red commit publishes the breakage rather than reporting it.
    needs: [test, wheel, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the state this job reads; the default shallow fetch has none.
          fetch-depth: 0

      - name: Tag the version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `tomllib`, not a grep for `^version =`: a version key in any section
          # above [project] wins that grep, and "9.9.9" is a perfectly valid tag
          # name — so the wrong release ships silently rather than failing. Also
          # handles the single-quoted form, which TOML allows and `cut -d'"'`
          # returns whole. Python 3.11+ is preinstalled; this needs no setup step.
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')

          # Each half is keyed on its own existence rather than both on the tag.
          # Sharing one key means a `gh release create` that fails after the push
          # is never retried — the next run sees the tag, exits 0, and the release
          # stays missing. That is the failure this job exists to stop.
          # `refs/tags/` explicitly: a branch sharing the name is not a release.
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v already tagged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$v" -m "v$v"
            git push origin "v$v"
          fi

          # The message stays bare and the summary lives in the release, built
          # from the merged PRs. Deriving it from commit subjects was the other
          # option and this repo's subjects are not consistently conventional.
          gh release view "v$v" >/dev/null 2>&1 || gh release create "v$v" --generate-notes
