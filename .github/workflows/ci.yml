name: CI

on:
  push:
    branches: [master]
  # No base-branch filter: this repo stacks PRs (#15 targets #13's branch, not
  # master), and `branches: [master]` silently skips every one of them — the
  # PRs that most need a check are the ones that would not get it.
  pull_request:

# A new push to a PR makes the in-flight run pointless — drop it rather than
# queue behind it. master is excluded so every merge keeps a run of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11: test the floor and the current release,
        # since nothing here is version-sensitive enough to justify every minor.
        python: ["3.11", "3.13"]

    # Pin the interpreter for every uv command in the job rather than relying on
    # `uv python install` to steer later `uv sync`/`uv run` calls. It happened to
    # pick the right one (3.11.15 / 3.13.14 in the first run), but that is uv's
    # discovery order, not a guarantee — and a matrix that silently tests one
    # version twice is worse than no matrix, because it reports success.
    env:
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv sync --extra dev

      # Fails the job if the interpreter is not the one the matrix asked for,
      # so a silent fallback shows up as a red build instead of a green lie.
      - name: Assert the interpreter matches the matrix
        run: |
          actual=$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "matrix=${{ matrix.python }} actual=$actual"
          test "$actual" = "${{ matrix.python }}"

      # The suite shells out to git constantly: it builds throwaway repos as
      # install sources and asserts on `--ref master`. Runner defaults are not
      # guaranteed to match, so pin what the tests assume rather than let a
      # runner image change break them.
      - name: Configure git for the test suite
        run: |
          git config --global init.defaultBranch master
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Test
        # One test clones a deliberately nonexistent repo to assert the failure
        # path. With no credential helper on the runner, git would sit waiting
        # for a username instead of failing — this makes it fail fast.
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: uv run pytest -q

  # The one property the other two jobs structurally cannot check. Both run
  # against the source tree, where the vendored trees are present and executable
  # regardless of what the wheel ships — so a dropped `MANIFEST.in` graft or a
  # `.sh` committed 644 stays green here and fails on a user's machine.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build --wheel

      # Deliberately not `uv sync`, which installs the project editable and
      # would read `wfctl/agents/` straight off the checkout — passing even if
      # the wheel carried nothing at all.
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl

      - name: Assert the wheel carries the bundled trees, executable bit intact
        run: /tmp/wheel-env/bin/python .github/scripts/check_wheel_contents.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      # `uv run`, not `uvx`: this has to be the version in uv.lock. `uvx ruff`
      # pulls whatever is newest, which means an upstream release can redden a
      # branch nobody touched — 0.16 would have added ~40 findings here.
      - name: Lint
        run: uv run ruff check .

      # Config lives in [tool.mypy], including which paths it covers, so this
      # stays a bare invocation rather than drifting from what runs locally.
      - name: Typecheck
        run: uv run mypy
