name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: this repo stacks PRs (#15 targets #13's branch, not
  # main), and `branches: [main]` silently skips every one of them — the
  # PRs that most need a check are the ones that would not get it.
  pull_request:

# A new push to a PR makes the in-flight run pointless, so drop it rather than
# queue behind it. A run on main gets a group of its own instead, because
# GitHub cancels a waiting run whenever a newer one joins its group, whatever
# cancel-in-progress says, and that waiting run can be the release merge's.
# The tag job keeps runs on main in order on its own (`release-tag` below).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The PR jobs run the PR's own code, and the default token can push in this
# repository. Every job reads only, and the tag job asks for write itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11: test the floor and the current release,
        # since nothing here is version-sensitive enough to justify every minor.
        python: ["3.11", "3.13"]

    # Pin the interpreter for every uv command in the job rather than relying on
    # `uv python install` to steer later `uv sync`/`uv run` calls. It happened to
    # pick the right one (3.11.15 / 3.13.14 in the first run), but that is uv's
    # discovery order, not a guarantee — and a matrix that silently tests one
    # version twice is worse than no matrix, because it reports success.
    env:
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # Bare, not `--extra dev`. The three commands AGENTS.md documents are
      # supposed to work on an environment nobody prepared, and `--extra dev`
      # installed the tools directly — so the group they actually depend on
      # could stop resolving and CI would stay green while every fresh worktree
      # broke the way #105 did. Syncing the way a contributor does is what makes
      # this job evidence for the claim the file makes.
      - name: Install
        run: uv sync

      # Fails the job if the interpreter is not the one the matrix asked for,
      # so a silent fallback shows up as a red build instead of a green lie.
      - name: Assert the interpreter matches the matrix
        run: |
          actual=$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "matrix=${{ matrix.python }} actual=$actual"
          test "$actual" = "${{ matrix.python }}"

      # `conftest.py` `git init`s a real repo for every test that installs into
      # one, and wfctl resolves the branch and repo root by shelling out to git.
      # Runner defaults are not guaranteed to match what the tests assume, so pin
      # them rather than let a runner image change break the suite.
      - name: Configure git for the test suite
        run: |
          git config --global init.defaultBranch master
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: Test
        run: uv run pytest -q

  # The one property the other two jobs structurally cannot check. Both run
  # against the source tree, where the vendored trees are present and executable
  # regardless of what the wheel ships — so a dropped `MANIFEST.in` graft or a
  # `.sh` committed 644 stays green here and fails on a user's machine.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build --wheel

      # Deliberately not `uv sync`, which installs the project editable and
      # would read `wfctl/agents/` straight off the checkout — passing even if
      # the wheel carried nothing at all.
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl

      - name: Assert the wheel carries the bundled trees, executable bit intact
        run: /tmp/wheel-env/bin/python .github/scripts/check_wheel_contents.py

      # Carrying the trees and installing them are separate failures: a target
      # pair repointed at a directory that no longer exists copies nothing and
      # still exits 0. Needs a real repo — wfctl resolves its root through git.
      - name: Install into a scratch repo from the wheel's own bundle
        run: |
          git config --global init.defaultBranch master
          git config --global user.email ci@example.com
          git config --global user.name CI
          git init /tmp/scratch-repo
          cd /tmp/scratch-repo && /tmp/wheel-env/bin/wfctl install-skills --yes

      - name: Assert the installed tree matches the shipped one
        run: /tmp/wheel-env/bin/python .github/scripts/check_installed_tree.py /tmp/scratch-repo

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The lock records this package's own version, so a release bump that
      # leaves it behind makes every `uv run` a developer makes rewrite it into a
      # modified file nobody edited. Nothing else here notices, since a bare
      # `uv sync` updates a stale lock before anything reads it; this step runs
      # first for that reason. Five releases needed a hand-made sync afterwards,
      # 0.7.0, 0.13.0, 0.18.0, 0.20.0, and 0.21.0, before this step existed (#514).
      - name: Assert uv.lock is current
        run: uv lock --check

      # Bare, for the reason the test job states: `--extra dev` would install
      # ruff and mypy even if the group stopped resolving.
      - name: Install
        run: uv sync

      # `uv run`, not `uvx`: this has to be the version in uv.lock. `uvx ruff`
      # pulls whatever is newest, which means an upstream release can redden a
      # branch nobody touched — 0.16 would have added ~40 findings here.
      - name: Lint
        run: uv run ruff check .

      # Config lives in [tool.mypy], including which paths it covers, so this
      # stays a bare invocation rather than drifting from what runs locally.
      - name: Typecheck
        run: uv run mypy

  # Pull requests only: on main there is no branch to hold a note, so it could
  # only pass. Not in the tag job's `needs` for the same reason.
  #
  # The job name is one of the six checks `.github/rulesets/main.json`
  # requires, so renaming it means editing that file and applying it again. A
  # required check whose name never reports blocks every merge into main.
  release-note:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The full history, because the default checkout has no origin/main for
      # the check to find where this branch left it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner's own Python, with no `uv sync`: the check uses the standard
      # library only, and 3.11+ is preinstalled, which is what `tomllib` needs.
      - name: Check the branch commits its release note
        run: python3 .github/scripts/check_release_note.py

  # Publishes the release that a merged release pull request describes. The
  # version call is a person's: they confirm it, and the release notes, in
  # `.github/scripts/release.py` before the pull request exists, where the
  # major/minor/patch decision has the notes in front of it. This job only
  # turns that commit into a tag and a GitHub release, because the tag is the
  # half that keeps getting dropped: `doctor` and `uv tool install` both resolve
  # releases by tag, so an untagged bump reports the stale build as current
  # (#55). The release text is that commit's body and nothing else, so editing
  # the pull request's description on GitHub changes nothing here.
  tag:
    # Not a convenience ordering. A tag is what every machine upgrades to, so
    # tagging a red commit publishes the breakage rather than reporting it.
    needs: [test, wheel, lint]
    if: github.ref == 'refs/heads/main'
    # Runs on main no longer share a group, so two tag jobs could otherwise run
    # at once and both push the same tag. This group runs them one at a time,
    # and `queue: max` keeps every waiting tag job instead of cancelling all but
    # the newest. They start in the order their tests finish, not the order the
    # commits merged, which is safe because tag_release.py finds the release
    # commit by its subject rather than tagging the commit it runs on.
    concurrency:
      group: release-tag
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the state this job reads; the default shallow fetch has none.
          fetch-depth: 0

      # The runner's own Python, with no `uv sync`: the script uses the standard
      # library only. The logic lives in a script so that tests/test_tag_release.py
      # can run it against a scratch repository.
      - name: Tag the version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/tag_release.py
