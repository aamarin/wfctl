<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .head-red { fill: #cf222e; }
    .refused-edge { stroke: #cf222e; stroke-width: 2; fill: none; }
    .refused-label { fill: #cf222e; font-weight: 600; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .group { stroke: #6e7681; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .refused-edge { stroke: #ff7b72; }
      .refused-label, .head-red { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="8" class="bg"/>

  <rect x="10" y="20" width="160" height="330" class="group"/>
  <text x="20" y="40" class="name">agent</text>
  <rect x="210" y="20" width="150" height="330" class="group"/>
  <text x="220" y="40" class="name">worktree guard</text>
  <rect x="400" y="20" width="160" height="330" class="group"/>
  <text x="410" y="40" class="name">accept command</text>
  <rect x="600" y="20" width="150" height="330" class="group"/>
  <text x="610" y="40" class="name">PR review</text>

  <rect x="20" y="70" width="140" height="50" rx="6" class="box"/>
  <text x="90" y="92" text-anchor="middle" class="label">types the literal<tspan x="90" dy="1.3em">words</tspan></text>

  <rect x="20" y="170" width="140" height="50" rx="6" class="box"/>
  <text x="90" y="200" text-anchor="middle" class="label">hides the words</text>

  <rect x="225" y="70" width="120" height="150" rx="6" class="box"/>
  <text x="285" y="150" text-anchor="middle" class="name">text check</text>

  <line x1="160" y1="95" x2="222" y2="95" class="refused-edge"/>
  <text x="223" y="100" text-anchor="middle" class="refused-label">✗</text>
  <text x="168" y="140" class="refused-label">literal<tspan x="168" dy="1.3em">words</tspan></text>

  <line x1="160" y1="195" x2="223" y2="195" class="edge" marker-end="url(#arrow)"/>
  <text x="168" y="240" class="label">words built<tspan x="168" dy="1.3em">at run time</tspan></text>

  <rect x="415" y="170" width="130" height="50" rx="6" class="box"/>
  <text x="480" y="200" text-anchor="middle" class="name">terminal check</text>

  <line x1="345" y1="195" x2="413" y2="195" class="edge" marker-end="url(#arrow)"/>
  <text x="379" y="186" text-anchor="middle" class="label">not refused</text>

  <rect x="415" y="280" width="130" height="50" rx="6" class="box"/>
  <text x="480" y="302" text-anchor="middle" class="label">record status<tspan x="480" dy="1.3em">accepted</tspan></text>

  <line x1="480" y1="220" x2="480" y2="278" class="edge" marker-end="url(#arrow)"/>
  <text x="488" y="254" class="label">pseudo-terminal</text>

  <rect x="615" y="280" width="120" height="50" rx="6" class="box"/>
  <text x="675" y="302" text-anchor="middle" class="label">person reads<tspan x="675" dy="1.3em">the PR diff</tspan></text>

  <line x1="545" y1="305" x2="613" y2="305" class="edge later" marker-end="url(#arrow)"/>
  <text x="579" y="346" text-anchor="middle" class="label">shows in the diff</text>

  <text x="20" y="380" class="caption">The text check refuses the literal words; an accept with hidden words shows in the PR diff.</text>
</svg>
