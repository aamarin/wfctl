<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .new { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; font-size: 12px; }
    .heading { fill: #59636e; font-weight: 600; font-size: 13px; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .divider { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 8 4; }
    .split { stroke: #d0d7de; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .new { fill: #0c2d6b; stroke: #4493f8; }
      .name, .label { fill: #e6edf3; }
      .heading, .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .divider { stroke: #6e7681; }
      .split { stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" rx="8" class="bg"/>

  <text x="20" y="24" class="heading">baseline</text>
  <text x="480" y="24" class="heading">decision</text>
  <line x1="450" y1="10" x2="450" y2="380" class="split"/>

  <line x1="10" y1="120" x2="890" y2="120" class="divider"/>
  <text x="890" y="112" text-anchor="end" class="label">the user's file</text>
  <text x="890" y="136" text-anchor="end" class="label">wfctl install</text>

  <!-- baseline -->
  <rect x="40" y="40" width="370" height="44" rx="6" class="box"/>
  <text x="225" y="67" text-anchor="middle" class="name">settings file</text>

  <rect x="20" y="320" width="95" height="44" rx="6" class="box"/>
  <text x="67" y="347" text-anchor="middle" class="name">hooks</text>
  <rect x="125" y="320" width="95" height="44" rx="6" class="box"/>
  <text x="172" y="347" text-anchor="middle" class="name">ask rules</text>
  <rect x="230" y="320" width="95" height="44" rx="6" class="box"/>
  <text x="277" y="347" text-anchor="middle" class="name">retire</text>
  <rect x="335" y="320" width="95" height="44" rx="6" class="box"/>
  <text x="382" y="347" text-anchor="middle" class="name">Bob Shell</text>

  <line x1="67" y1="320" x2="67" y2="86" class="edge" marker-end="url(#arrow)"/>
  <text x="73" y="200" class="label">reads,<tspan x="73" dy="1.3em">asks,</tspan><tspan x="73" dy="1.3em">saves</tspan></text>
  <line x1="172" y1="320" x2="172" y2="86" class="edge" marker-end="url(#arrow)"/>
  <text x="178" y="250" class="label">reads,<tspan x="178" dy="1.3em">asks,</tspan><tspan x="178" dy="1.3em">saves</tspan></text>
  <line x1="277" y1="320" x2="277" y2="86" class="edge" marker-end="url(#arrow)"/>
  <text x="283" y="200" class="label">reads,<tspan x="283" dy="1.3em">asks,</tspan><tspan x="283" dy="1.3em">saves</tspan></text>
  <line x1="382" y1="320" x2="382" y2="86" class="edge" marker-end="url(#arrow)"/>
  <text x="388" y="250" class="label">reads,<tspan x="388" dy="1.3em">asks,</tspan><tspan x="388" dy="1.3em">saves</tspan></text>

  <!-- decision -->
  <rect x="480" y="40" width="390" height="44" rx="6" class="box"/>
  <text x="675" y="67" text-anchor="middle" class="name">settings file</text>

  <rect x="580" y="140" width="190" height="44" rx="6" class="new"/>
  <text x="675" y="167" text-anchor="middle" class="name">asks and saves (new)</text>

  <rect x="480" y="220" width="390" height="44" rx="6" class="new"/>
  <text x="675" y="247" text-anchor="middle" class="name">in-memory copy (new)</text>

  <rect x="470" y="320" width="95" height="44" rx="6" class="box"/>
  <text x="517" y="347" text-anchor="middle" class="name">hooks</text>
  <rect x="575" y="320" width="95" height="44" rx="6" class="box"/>
  <text x="622" y="347" text-anchor="middle" class="name">ask rules</text>
  <rect x="680" y="320" width="95" height="44" rx="6" class="box"/>
  <text x="727" y="347" text-anchor="middle" class="name">retire</text>
  <rect x="785" y="320" width="95" height="44" rx="6" class="box"/>
  <text x="832" y="347" text-anchor="middle" class="name">Bob Shell</text>

  <line x1="517" y1="320" x2="517" y2="266" class="edge" marker-end="url(#arrow)"/>
  <text x="523" y="297" class="label">edits</text>
  <line x1="622" y1="320" x2="622" y2="266" class="edge" marker-end="url(#arrow)"/>
  <text x="628" y="297" class="label">edits</text>
  <line x1="727" y1="320" x2="727" y2="266" class="edge" marker-end="url(#arrow)"/>
  <text x="733" y="297" class="label">edits</text>
  <line x1="832" y1="320" x2="832" y2="266" class="edge" marker-end="url(#arrow)"/>
  <text x="838" y="297" class="label">edits</text>

  <line x1="500" y1="84" x2="500" y2="218" class="edge later" marker-end="url(#arrow)"/>
  <text x="506" y="160" class="label">reads once</text>

  <line x1="675" y1="220" x2="675" y2="186" class="edge" marker-end="url(#arrow)"/>
  <text x="681" y="207" class="label">every change</text>

  <line x1="675" y1="140" x2="675" y2="86" class="edge" marker-end="url(#arrow)"/>
  <text x="669" y="104" text-anchor="end" class="label">asks once, saves once</text>

  <text x="20" y="404" class="caption">The baseline saves the settings file once per change; the decision saves it once, after one question</text>
</svg>
