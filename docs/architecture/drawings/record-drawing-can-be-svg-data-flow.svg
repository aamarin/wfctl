<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .refused-edge { stroke: #cf222e; stroke-width: 2; fill: none; }
    .refused-label { fill: #cf222e; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .refused-edge { stroke: #ff7b72; }
      .refused-label { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" rx="8" class="bg"/>

  <rect x="20" y="70" width="130" height="50" rx="6" class="box"/>
  <text x="85" y="100" text-anchor="middle" class="name">record author</text>
  <rect x="300" y="70" width="130" height="50" rx="6" class="box"/>
  <text x="365" y="100" text-anchor="middle" class="name">drawings/</text>
  <rect x="580" y="70" width="160" height="50" rx="6" class="box"/>
  <text x="660" y="100" text-anchor="middle" class="name">wfctl arch accept</text>
  <rect x="580" y="230" width="160" height="40" rx="6" class="box"/>
  <text x="660" y="255" text-anchor="middle" class="name">refuses: no drawing</text>

  <path d="M85,70 V40 H660 V68" class="edge" marker-end="url(#arrow)"/>
  <text x="372" y="33" text-anchor="middle" class="label">links the SVG under ## Boundary</text>

  <line x1="150" y1="95" x2="298" y2="95" class="edge" marker-end="url(#arrow)"/>
  <text x="224" y="86" text-anchor="middle" class="label">writes the SVG</text>

  <line x1="430" y1="95" x2="578" y2="95" class="edge later" marker-end="url(#arrow)"/>
  <text x="504" y="86" text-anchor="middle" class="label">reads labels</text>

  <line x1="700" y1="120" x2="700" y2="228" class="edge" marker-end="url(#arrow)"/>
  <text x="692" y="210" text-anchor="end" class="label">file missing</text>

  <path d="M365,120 V175 H620 V124" class="refused-edge"/>
  <text x="480" y="167" text-anchor="middle" class="refused-label">answers the boundary question</text>
  <text x="620" y="150" text-anchor="middle" class="refused-label" font-size="18">✗</text>

  <text x="20" y="310" class="caption">wfctl reads a record's SVG for its drawing, but a file in drawings/ never counts as a record.</text>
</svg>
