<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .head-red { fill: #cf222e; }
    .refused-edge { stroke: #cf222e; stroke-width: 2; fill: none; }
    .refused-label { fill: #cf222e; font-weight: 600; }
    .failing-step, .wrong-way { stroke: #cf222e; stroke-width: 2; fill: none; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .group { stroke: #6e7681; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .refused-edge, .failing-step, .wrong-way { stroke: #ff7b72; }
      .refused-label, .head-red { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" rx="8" class="bg"/>

  <rect x="20" y="70" width="150" height="50" rx="6" class="box"/>
  <text x="95" y="100" text-anchor="middle" class="name">agent</text>

  <rect x="300" y="70" width="170" height="50" rx="6" class="box"/>
  <text x="385" y="100" text-anchor="middle" class="name">guard text check</text>

  <rect x="300" y="210" width="170" height="50" rx="6" class="box"/>
  <text x="385" y="240" text-anchor="middle" class="name">terminal check</text>

  <rect x="590" y="210" width="150" height="50" rx="6" class="box"/>
  <text x="665" y="240" text-anchor="middle" class="name">record</text>

  <rect x="590" y="70" width="150" height="50" rx="6" class="box"/>
  <text x="665" y="100" text-anchor="middle" class="name">human reviewer</text>

  <line x1="170" y1="82" x2="298" y2="82" class="edge" marker-end="url(#arrow)"/>
  <text x="234" y="74" text-anchor="middle" class="label">every command</text>

  <line x1="170" y1="108" x2="292" y2="108" class="refused-edge"/>
  <text x="296" y="113" text-anchor="middle" class="refused-label">✗</text>
  <text x="234" y="136" text-anchor="middle" class="refused-label">runs a plain accept</text>

  <line x1="385" y1="120" x2="385" y2="208" class="edge" marker-end="url(#arrow)"/>
  <text x="395" y="168" class="label">hidden accept</text>

  <line x1="470" y1="235" x2="588" y2="235" class="edge" marker-end="url(#arrow)"/>
  <text x="529" y="227" text-anchor="middle" class="label">pseudo-terminal</text>

  <line x1="665" y1="210" x2="665" y2="122" class="edge later" marker-end="url(#arrow)"/>
  <text x="675" y="168" class="label">PR diff</text>

  <text x="20" y="310" class="caption">The guard refuses a plain accept, and a hidden accept shows in the PR diff.</text>
</svg>
