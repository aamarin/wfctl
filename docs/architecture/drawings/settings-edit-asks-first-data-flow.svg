<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; font-weight: 400; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .refused-edge { stroke: #cf222e; stroke-width: 2; fill: none; }
    .refused-label { fill: #cf222e; font-weight: 600; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .group { stroke: #6e7681; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .refused-edge { stroke: #ff7b72; }
      .refused-label { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="8" class="bg"/>

  <rect x="10" y="20" width="170" height="280" rx="6" class="group"/>
  <text x="20" y="42" class="name">who runs install</text>
  <rect x="280" y="20" width="200" height="280" rx="6" class="group"/>
  <text x="290" y="42" class="name">wfctl</text>
  <rect x="620" y="20" width="170" height="180" rx="6" class="group"/>
  <text x="630" y="42" class="name">your project</text>

  <rect x="20" y="60" width="150" height="50" rx="6" class="box"/>
  <text x="95" y="90" text-anchor="middle" class="label">user at a terminal</text>
  <rect x="20" y="120" width="150" height="50" rx="6" class="box"/>
  <text x="95" y="150" text-anchor="middle" class="label">agent or hook</text>

  <rect x="300" y="60" width="160" height="110" rx="6" class="box"/>
  <text x="380" y="105" text-anchor="middle" class="name">install-skills
    <tspan x="380" dy="1.3em" class="label">asks before changing</tspan>
    <tspan x="380" dy="1.3em" class="label">an existing file</tspan>
  </text>

  <rect x="300" y="230" width="160" height="50" rx="6" class="box"/>
  <text x="380" y="260" text-anchor="middle" class="label">doctor warns</text>

  <rect x="635" y="90" width="140" height="50" rx="6" class="box"/>
  <text x="705" y="120" text-anchor="middle" class="label">settings file</text>

  <line x1="170" y1="85" x2="298" y2="85" class="edge" marker-end="url(#arrow)"/>
  <text x="234" y="77" text-anchor="middle" class="label">runs install</text>

  <line x1="170" y1="145" x2="298" y2="145" class="edge" marker-end="url(#arrow)"/>
  <text x="234" y="137" text-anchor="middle" class="label">runs it with --yes</text>

  <line x1="460" y1="115" x2="633" y2="115" class="edge" marker-end="url(#arrow)"/>
  <text x="547" y="90" text-anchor="middle" class="label">after a yes,
    <tspan x="547" dy="1.3em">or creates if missing</tspan>
  </text>

  <line x1="380" y1="170" x2="380" y2="228" class="edge later" marker-end="url(#arrow)"/>
  <text x="390" y="204" class="label">no terminal: skips</text>

  <path d="M95,170 V325 H705 V146" class="refused-edge"/>
  <text x="705" y="152" text-anchor="middle" class="refused-label">✗</text>
  <text x="300" y="318" class="refused-label">changes the file without a yes</text>

  <text x="20" y="362" class="caption">Install changes an existing settings file only after the user says yes at a terminal.</text>
</svg>
