<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .head-red { fill: #cf222e; }
    .refused-edge { stroke: #cf222e; stroke-width: 2; fill: none; }
    .refused-label { fill: #cf222e; font-weight: 600; }
    .failing-step, .wrong-way { stroke: #cf222e; stroke-width: 2; fill: none; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .group { stroke: #6e7681; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .refused-edge, .failing-step, .wrong-way { stroke: #ff7b72; }
      .refused-label, .head-red { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" rx="8" class="bg"/>

  <rect x="10" y="20" width="330" height="310" class="group"/>
  <text x="20" y="42" class="name">agent</text>

  <rect x="420" y="20" width="330" height="310" class="group"/>
  <text x="430" y="42" class="name">wfctl</text>

  <rect x="30" y="70" width="290" height="50" rx="6" class="box"/>
  <text x="175" y="100" text-anchor="middle" class="name">writes ## Threat model</text>

  <rect x="30" y="250" width="290" height="50" rx="6" class="box"/>
  <text x="175" y="280" text-anchor="middle" class="name">commits THREAT_MODEL.md</text>

  <rect x="440" y="70" width="240" height="50" rx="6" class="box"/>
  <text x="560" y="100" text-anchor="middle" class="name">reads the branch's records</text>

  <rect x="440" y="160" width="240" height="50" rx="6" class="box"/>
  <text x="560" y="190" text-anchor="middle" class="name">pauses threat-baseline</text>

  <rect x="440" y="250" width="240" height="50" rx="6" class="box"/>
  <text x="560" y="280" text-anchor="middle" class="name">marks the pass done</text>

  <line x1="320" y1="95" x2="438" y2="95" class="edge later" marker-end="url(#arrow)"/>
  <text x="380" y="87" text-anchor="middle" class="label">proposed record</text>

  <line x1="560" y1="120" x2="560" y2="158" class="edge" marker-end="url(#arrow)"/>
  <text x="570" y="144" class="label">file missing</text>

  <line x1="560" y1="210" x2="560" y2="248" class="edge" marker-end="url(#arrow)"/>
  <text x="570" y="234" class="label">once committed</text>

  <path d="M680,95 H700 V275 H682" class="edge" marker-end="url(#arrow)"/>
  <text x="704" y="182" class="label"><tspan x="704" dy="0">file</tspan><tspan x="704" dy="1.3em">present</tspan></text>

  <line x1="320" y1="275" x2="438" y2="275" class="edge later" marker-end="url(#arrow)"/>
  <text x="380" y="267" text-anchor="middle" class="label">commits</text>

  <path d="M175,120 V185 H432" class="refused-edge"/>
  <text x="436" y="190" text-anchor="middle" class="refused-label">✗</text>
  <text x="270" y="177" text-anchor="middle" class="refused-label">says it's built</text>

  <text x="20" y="360" class="caption">wfctl pauses the pass until THREAT_MODEL.md is committed, not on the agent's word.</text>
</svg>
