<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .head-red { fill: #cf222e; }
    .refused-edge { stroke: #cf222e; stroke-width: 2; fill: none; }
    .refused-label { fill: #cf222e; font-weight: 600; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .group { stroke: #6e7681; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .refused-edge { stroke: #ff7b72; }
      .refused-label, .head-red { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" rx="8" class="bg"/>

  <rect x="190" y="20" width="230" height="350" class="group"/>
  <text x="200" y="40" class="name">agent and hooks</text>

  <rect x="470" y="20" width="280" height="350" class="group"/>
  <text x="480" y="40" class="name">wfctl</text>

  <rect x="20" y="70" width="120" height="50" rx="6" class="box"/>
  <text x="80" y="100" text-anchor="middle" class="name">person</text>

  <rect x="210" y="70" width="190" height="50" rx="6" class="box"/>
  <text x="305" y="100" text-anchor="middle" class="name">agent</text>

  <rect x="210" y="190" width="190" height="50" rx="6" class="box"/>
  <text x="305" y="220" text-anchor="middle" class="name">post_create hook</text>

  <rect x="210" y="300" width="190" height="50" rx="6" class="box"/>
  <text x="305" y="330" text-anchor="middle" class="name">pane restart</text>

  <rect x="490" y="70" width="240" height="50" rx="6" class="box"/>
  <text x="610" y="100" text-anchor="middle" class="name">wfctl auto-approve</text>

  <rect x="490" y="190" width="110" height="50" rx="6" class="box"/>
  <text x="545" y="220" text-anchor="middle" class="name">mode.json</text>

  <rect x="620" y="190" width="110" height="50" rx="6" class="box"/>
  <text x="675" y="220" text-anchor="middle" class="name">events.jsonl</text>

  <line x1="140" y1="95" x2="208" y2="95" class="edge" marker-end="url(#arrow)"/>
  <text x="174" y="86" text-anchor="middle" class="label">asks</text>

  <path d="M80,120 V215 H208" class="edge" marker-end="url(#arrow)"/>
  <text x="90" y="160" class="label"><tspan x="90" dy="0">sets the</tspan><tspan x="90" dy="1.3em">variable</tspan></text>

  <line x1="400" y1="95" x2="488" y2="95" class="edge" marker-end="url(#arrow)"/>
  <text x="444" y="86" text-anchor="middle" class="label">on / off</text>

  <path d="M400,215 H445 V110 H488" class="edge" marker-end="url(#arrow)"/>
  <text x="437" y="165" text-anchor="end" class="label">on, once</text>

  <line x1="545" y1="120" x2="545" y2="188" class="edge" marker-end="url(#arrow)"/>
  <text x="537" y="158" text-anchor="end" class="label">writes</text>

  <line x1="675" y1="120" x2="675" y2="188" class="edge" marker-end="url(#arrow)"/>
  <text x="667" y="158" text-anchor="end" class="label">logs the session</text>

  <line x1="400" y1="325" x2="464" y2="325" class="refused-edge"/>
  <text x="468" y="330" text-anchor="middle" class="refused-label">✗</text>
  <text x="490" y="330" class="refused-label">grants from the variable</text>

  <text x="20" y="400" class="caption">The agent or the creation hook turns the mode on, and wfctl never grants from the variable.</text>
</svg>
