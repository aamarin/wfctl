<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .head-red { fill: #cf222e; }
    .refused-edge { stroke: #cf222e; stroke-width: 2; fill: none; }
    .refused-label { fill: #cf222e; font-weight: 600; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .group { stroke: #6e7681; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .refused-edge { stroke: #ff7b72; }
      .refused-label, .head-red { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" rx="8" class="bg"/>

  <rect x="20" y="40" width="180" height="350" rx="6" class="group"/>
  <text x="32" y="62" class="name">git</text>
  <rect x="340" y="40" width="440" height="350" rx="6" class="group"/>
  <text x="352" y="62" class="name">wfctl</text>

  <rect x="35" y="80" width="150" height="50" rx="6" class="box"/>
  <text x="110" y="110" text-anchor="middle" class="name">worktree created</text>
  <rect x="35" y="200" width="150" height="50" rx="6" class="box"/>
  <text x="110" y="230" text-anchor="middle" class="name">commondir file</text>
  <line x1="110" y1="130" x2="110" y2="198" class="edge" marker-end="url(#arrow)"/>
  <text x="118" y="170" class="label">writes once</text>

  <rect x="370" y="80" width="170" height="50" rx="6" class="box"/>
  <text x="455" y="110" text-anchor="middle" class="name">removal hook</text>
  <path d="M185,225 H300 V105 H368" class="edge later" marker-end="url(#arrow)"/>
  <text x="245" y="200" text-anchor="middle" class="label">reads<tspan x="245" dy="1.3em">modified time</tspan></text>

  <rect x="630" y="80" width="140" height="50" rx="6" class="box"/>
  <text x="700" y="110" text-anchor="middle" class="name">writes nothing</text>
  <line x1="540" y1="105" x2="628" y2="105" class="edge" marker-end="url(#arrow)"/>
  <text x="584" y="96" text-anchor="middle" class="label">file missing</text>

  <rect x="370" y="200" width="170" height="50" rx="6" class="box"/>
  <text x="455" y="230" text-anchor="middle" class="name">event log</text>
  <line x1="420" y1="130" x2="420" y2="198" class="edge" marker-end="url(#arrow)"/>
  <text x="428" y="170" class="label">writes both times</text>

  <path d="M540,225 H585 V118 H548" class="refused-edge"/>
  <text x="540" y="123" class="refused-label">✗</text>
  <text x="593" y="175" class="refused-label">first event as start time</text>

  <rect x="370" y="320" width="170" height="50" rx="6" class="box"/>
  <text x="455" y="350" text-anchor="middle" class="name">wfctl timings</text>
  <line x1="455" y1="250" x2="455" y2="318" class="edge later" marker-end="url(#arrow)"/>
  <text x="463" y="290" class="label">reads every branch</text>

  <text x="20" y="420" class="caption">The removal hook reads the worktree's creation time from git and writes both times to the event log.</text>
</svg>
