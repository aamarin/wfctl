<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .later { stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .head-red { fill: #cf222e; }
    .refused-edge { stroke: #cf222e; stroke-width: 2; fill: none; }
    .refused-label { fill: #cf222e; font-weight: 600; }
    .failing-step, .wrong-way { stroke: #cf222e; stroke-width: 2; fill: none; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .group { stroke: #6e7681; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .refused-edge, .failing-step, .wrong-way { stroke: #ff7b72; }
      .refused-label, .head-red { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="350" rx="8" class="bg"/>

  <text x="20" y="28" class="name">baseline</text>
  <text x="395" y="28" class="name">decision</text>
  <line x1="378" y1="15" x2="378" y2="305" class="group"/>

  <line x1="10" y1="125" x2="750" y2="125" class="group"/>
  <text x="748" y="118" text-anchor="end" class="caption">upstream files, never edited</text>

  <rect x="110" y="45" width="180" height="50" rx="6" class="box"/>
  <text x="200" y="75" text-anchor="middle" class="name">threat-model</text>

  <rect x="20" y="250" width="170" height="50" rx="6" class="box"/>
  <text x="105" y="270" text-anchor="middle" class="name"><tspan x="105" dy="0">design-levels</tspan><tspan x="105" dy="1.3em">+ additions</tspan></text>

  <rect x="210" y="250" width="150" height="50" rx="6" class="box"/>
  <text x="285" y="280" text-anchor="middle" class="name">pass command</text>

  <line x1="105" y1="250" x2="160" y2="97" class="edge" marker-end="url(#arrow)"/>
  <text x="96" y="190" class="label">names</text>

  <line x1="285" y1="250" x2="240" y2="97" class="edge" marker-end="url(#arrow)"/>
  <text x="270" y="190" class="label">names</text>

  <rect x="480" y="45" width="180" height="50" rx="6" class="box"/>
  <text x="570" y="75" text-anchor="middle" class="name">threat-model</text>

  <rect x="480" y="150" width="180" height="50" rx="6" class="box"/>
  <text x="570" y="180" text-anchor="middle" class="name">threat-baseline (new)</text>

  <rect x="395" y="250" width="150" height="50" rx="6" class="box"/>
  <text x="470" y="280" text-anchor="middle" class="name">design-levels</text>

  <rect x="595" y="250" width="150" height="50" rx="6" class="box"/>
  <text x="670" y="280" text-anchor="middle" class="name">pass command</text>

  <line x1="570" y1="150" x2="570" y2="97" class="edge" marker-end="url(#arrow)"/>
  <text x="578" y="143" class="label">runs</text>

  <line x1="470" y1="250" x2="530" y2="202" class="edge" marker-end="url(#arrow)"/>
  <text x="452" y="228" class="label">names</text>

  <line x1="670" y1="250" x2="610" y2="202" class="edge" marker-end="url(#arrow)"/>
  <text x="648" y="228" class="label">names</text>

  <text x="20" y="335" class="caption">The additions move out of design-levels into their own skill, and one arrow crosses into upstream instead of two.</text>
</svg>
