<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .name { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .label { fill: #1f2328; }
    .caption { fill: #59636e; font-size: 13px; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .name, .label { fill: #e6edf3; }
      .caption { fill: #9198a1; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="170" rx="8" class="bg"/>

  <rect x="20" y="40" width="160" height="70" rx="6" class="box"/>
  <text x="100" y="70" text-anchor="middle" class="name">Install</text>
  <text x="100" y="90" text-anchor="middle" class="label">once per repository</text>

  <rect x="300" y="40" width="160" height="70" rx="6" class="box"/>
  <text x="380" y="70" text-anchor="middle" class="name">Drive the pipeline</text>
  <text x="380" y="90" text-anchor="middle" class="label">every feature</text>

  <rect x="580" y="40" width="160" height="70" rx="6" class="box"/>
  <text x="660" y="70" text-anchor="middle" class="name">Open the change</text>
  <text x="660" y="90" text-anchor="middle" class="label">every pull request</text>

  <line x1="180" y1="75" x2="298" y2="75" class="edge" marker-end="url(#arrow)"/>
  <text x="240" y="66" text-anchor="middle" class="label">skills in place</text>

  <line x1="460" y1="75" x2="578" y2="75" class="edge" marker-end="url(#arrow)"/>
  <text x="520" y="66" text-anchor="middle" class="label">work verified</text>

  <text x="20" y="150" class="caption">You install the skills once per repository, then drive every feature through the pipeline and open each change as a PR.</text>
</svg>
