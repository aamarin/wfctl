[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wfctl"
version = "0.15.0"
description = "Workflow state CLI for agent session and pipeline tracking"
authors = [{ name = "Andre Marin", email = "andre@alexamarin.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
# ruff is pinned to a minor, not floated: its default rule set widens between
# releases (0.16 added ~40 findings to this repo over 0.15), so an unpinned
# linter turns someone else's release into a red build on an untouched branch.
dev = ["pytest>=8", "ruff>=0.15,<0.16", "mypy>=1.11,<3"]

[project.scripts]
wfctl = "wfctl.cli:app"

[tool.setuptools.packages.find]
include = ["wfctl*"]

[tool.pytest.ini_options]
markers = [
    "real_version_check: exercises `_check_wfctl_version` itself, so conftest's autouse stub steps aside",
]

[tool.ruff.lint]
# Explicit rather than inherited, for the same reason the version is pinned.
# E and F are ruff's own reimplementations of pycodestyle and pyflakes — no
# extra tool is installed, ruff runs these rules itself. They cover unused
# imports, undefined names, f-string mistakes: always a defect, never taste.
# Deliberately not enabled yet: I (import sorting), UP, PL, RUF. Each is
# defensible and each is a separate, reviewable diff; see #14.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["wfctl"]
# `disallow_untyped_defs` is the setting that earns its keep here: mypy's
# defaults skip unannotated function bodies entirely, so a clean run without
# it mostly means "nothing was checked".
disallow_untyped_defs = true

# Not `strict`, deliberately. It reports 26 findings, all of one shape:
# bare `dict`/`tuple` wanting parameters, and json.loads() returning Any. The
# fix is ~30 lines of `dict[str, Any]` and `cast(...)` around JSON blobs whose
# shape is genuinely dynamic — noise that buys no safety. Revisit if the
# manifest and session payloads ever get real TypedDicts.

# Tests are not checked: they are full of intentionally malformed fixtures.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
