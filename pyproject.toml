[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wfctl"
version = "0.24.0"
description = "Design method and evidence governance for AI coding agents"
authors = [{ name = "Andre Marin", email = "andre@alexamarin.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
# ruff is pinned to a minor, not floated: its default rule set widens between
# releases (0.16 added ~40 findings to this repo over 0.15), so an unpinned
# linter turns someone else's release into a red build on an untouched branch.
#
# towncrier is pinned to a year, not a minor like ruff. It uses calendar
# versions, so its first number is the year and the upper bound holds back the
# next year's release, which is the one that could change the note file name
# format that the release note check parses.
dev = ["pytest>=8", "ruff>=0.15,<0.16", "mypy>=1.11,<3", "build>=1", "pyyaml>=6,<7", "towncrier>=26.9,<27"]

[dependency-groups]
# The same tools, reached the way `uv run` reaches things. uv installs a
# group named exactly `dev` by default — rename it and it is silently ignored —
# and it never installs an extra, so without this the documented
# `uv run pytest/ruff/mypy` resolve against PATH on a cold venv: mypy is not
# there and errors, pytest and ruff are and run Homebrew's unpinned copies,
# reporting a pass from a linter the pin above exists to exclude.
# Self-referential rather than a second copy of the list — the extra stays the
# source of truth, and `pip install -e ".[dev]"` keeps working.
dev = ["wfctl[dev]"]

[project.scripts]
# Not `cli:app`. `wfctl hook worktree-guard` runs before every Bash call an
# agent makes, and reaching it through `cli` costs typer and rich — 68.5 of the
# guard's 81.7 ms, neither used on that path (#135). `_entry` dispatches that one
# argv without importing the CLI and falls through for everything else.
wfctl = "wfctl._entry:main"

[tool.setuptools.packages.find]
include = ["wfctl*"]

[tool.pytest.ini_options]
# A bare `pytest` otherwise walks `wt/`, collects every worktree's copy of
# `tests/` and dies on ImportPathMismatchError. `testpaths` rather than
# `norecursedirs`, which is a replacement and not an addition — excluding `wt`
# that way would also drop pytest's own defaults and start collecting `.venv`.
testpaths = ["tests"]
markers = [
    "real_version_check: exercises `_check_wfctl_version` itself, so conftest's autouse stub steps aside",
    "real_remote: exercises `_spec_store._check_remote` itself, so conftest's guard against pushing outside tmp_path steps aside",
    "real_install_origin: reads the installed distribution's direct_url.json, so conftest's release stub steps aside",
    "runs_mypy: shells out to mypy, so it costs seconds rather than milliseconds",
    "builds_wheel: shells out to a real `python -m build`, so it costs seconds rather than milliseconds",
]

# The release notes live in `changes/`, one file per change. The release script
# runs `towncrier build --draft`, which writes nothing, so the file named by
# `filename` is never created; it only selects the markdown template. This
# table is also the one list of categories: the release note check reads the
# `[[tool.towncrier.type]]` directories from here instead of keeping its own.
[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "change"
name = "Behaviour changes"
showcontent = true

[[tool.towncrier.type]]
directory = "addition"
name = "Additions"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "none"
name = "Nothing to notice"
showcontent = true

[tool.ruff.lint]
# Explicit rather than inherited, for the same reason the version is pinned.
# E and F are ruff's own reimplementations of pycodestyle and pyflakes — no
# extra tool is installed, ruff runs these rules itself. They cover unused
# imports, undefined names, f-string mistakes: always a defect, never taste.
# Deliberately not enabled yet: I (import sorting), UP, PL, RUF. Each is
# defensible and each is a separate, reviewable diff; see #14.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# `.github/scripts` decide what gets tagged and published, so a wrong type
# there ships a bad release rather than failing a test.
files = ["wfctl", ".github/scripts"]
# `disallow_untyped_defs` is the setting that earns its keep here: mypy's
# defaults skip unannotated function bodies entirely, so a clean run without
# it mostly means "nothing was checked".
disallow_untyped_defs = true

# Not `strict`, deliberately. It reports two shapes: bare `dict`/`tuple`
# wanting parameters, and json.loads() returning Any where a type is declared.
# The fix is `dict[str, Any]` and `cast(...)` around JSON blobs whose shape is
# genuinely dynamic — noise that buys no safety. Revisit if the manifest and
# session payloads ever get real TypedDicts.
#
# No count here on purpose: `uv run mypy --strict wfctl/` is the count, and the
# number that used to sit in this comment had drifted with nothing watching it.
# AGENTS.md carries the same rationale for a reader who is not in this file.

# Tests are not checked: they are full of intentionally malformed fixtures.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
